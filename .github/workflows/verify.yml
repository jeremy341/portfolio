name: Verify portfolio changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/mobile-navigation-refresh-nov2026]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
